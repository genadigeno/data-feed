name: Release

# Pushing a tag such as v1.0.0 builds every platform and publishes a GitHub release, with the
# notes taken from that version's section of CHANGELOG.md.
on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse --short HEAD)"
          pkg=github.com/genadigeno/data-feed/internal/buildinfo
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="datafeed_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X $pkg.Version=$version -X $pkg.Commit=$commit" \
              -o "dist/$name/datafeed$ext" ./cmd/datafeed
            cp -r LICENSE README.md CHANGELOG.md datafeed.example.yaml examples "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "dist/$name"
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Try the Linux build
        shell: bash
        run: |
          tar -xzf dist/datafeed_linux_amd64.tar.gz
          cd datafeed_linux_amd64
          test "$(./datafeed version --short)" = "${GITHUB_REF_NAME#v}"
          ./datafeed generate --schema examples/customer.yaml --count 10 > /dev/null
      - name: Release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## [$version]" 'index($0, v) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "datafeed ${GITHUB_REF_NAME#v}" --notes-file notes.md
