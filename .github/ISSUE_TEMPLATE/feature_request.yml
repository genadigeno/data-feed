name: Feature request
description: Suggest something datafeed should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the data you need, rather than a solution.
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working, if you have an idea.
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
