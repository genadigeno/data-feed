kind: hybrid
definitions:
  address:
    fields:
      city: { type: city, presence: required }
      zip:  { type: postal_code, presence: { optional: 0.9 } }
fields:
  id:        { type: uuid, presence: required, unique: true }
  firstName: { type: first_name, presence: required }
  age:       { type: integer, presence: required, min: 18, max: 90, distribution: { type: normal, mean: 40, stddev: 12 } }
  active:    { type: boolean }
  tier:      { type: enum, values: [gold, silver, bronze], weights: [1, 3, 6] }
  balance:   { type: money, scale: 2, min: 0, max: 100000, default: 0, default_probability: 0.1 }
  joined:    { type: date, min: "2020-01-01", max: "2026-01-01" }
  lastName:  { type: last_name, presence: { optional: 0.8 }, nullable: true, null_probability: 0.05 }
  email:     { type: email, presence: { optional: 0.6 }, unique: true }
  home:      { type: nested_schema, schema: address, presence: { optional: 0.5 } }
  work:
    type: object
    presence: { optional: 0.5 }
    fields:
      company: { type: company_name, presence: required }
      address: { type: nested_schema, schema: address }
  tags:      { type: array, min_length: 0, max_length: 4, items: { type: string, max_length: 12 } }
  attrs:     { type: map, max_length: 3, key: { type: string, max_length: 8 }, value: { type: integer } }
  ip:        { type: ipv4, ranges: documentation }
extra_random:
  probability: 0.3
  spec: { fields: { min: 1, max: 3 }, depth: { max: 1 } }
