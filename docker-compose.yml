# Local distributed setup: one Coordinator and, with `--profile workers`, Workers.
# It starts no database, cache, broker or object store, and only the Coordinator
# mounts the data volume.
#
#   docker compose up --build
#   docker compose --profile workers up --build --scale worker=3

services:
  coordinator:
    build: .
    image: datafeed:dev
    environment:
      DATAFEED_APPLICATION__ENVIRONMENT: development
      # Published on loopback only (see ports); no authentication exists in this lab setup.
      DATAFEED_AUTH__INSECURE_ALLOW_UNAUTHENTICATED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - coordinator-data:/data
    healthcheck:
      test: ["CMD", "/datafeed", "health", "--ready", "--server", "http://127.0.0.1:8080"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 40s

  worker:
    profiles: ["workers"]
    image: datafeed:dev
    command: ["worker", "run", "--coordinator", "https://coordinator:8081"]
    environment:
      DATAFEED_APPLICATION__ENVIRONMENT: development
      # The Coordinator's certificate is generated at runtime, so it cannot be pinned
      # in this file. Allowed in development only; production pins it or uses a CA.
      DATAFEED_WORKER__COORDINATOR_INSECURE_SKIP_VERIFY: "true"
    depends_on:
      coordinator:
        condition: service_healthy
    volumes:
      - type: tmpfs
        target: /spool
        tmpfs:
          mode: 0o1777
    stop_grace_period: 70s

volumes:
  coordinator-data:
